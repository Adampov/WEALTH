[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "wealth-ai"
version = "0.1.0"
description = "A governed multi-agent cryptocurrency research and trading platform."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.12,<3",
]

[project.scripts]
wealth-health = "wealth.cli:main"
wealth-collector-health = "wealth.collector_health_cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6,<7",
    "mypy>=2,<3",
    "pytest>=9,<10",
    "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wealth"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib"]
testpaths = ["tests"]
