name: Continuous Integration

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.check-name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            check-name: Quality and security
          - os: windows-latest
            check-name: Quality and security (Windows)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.31"
          enable-cache: true

      - name: Install pinned Python
        run: uv python install

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Verify lockfile
        run: uv lock --check

      - name: Verify formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy

      - name: Test
        run: uv run pytest

      - name: Audit dependencies
        run: uv --preview-features audit-command audit --locked

      - name: Run foundation health slice
        run: uv run wealth-health
