name: Continuous Integration

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TASK064_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  quality_gates:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.31"
          enable-cache: true

      - name: Install pinned Python
        run: uv python install

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Verify lockfile
        run: uv lock --check

      - name: Verify formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy

      - name: Audit dependencies
        run: uv --preview-features audit-command audit --locked

      - name: Run foundation health slice
        run: uv run wealth-health

  report:
    name: TASK-064 report shard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      task064_packet_b64: ${{ steps.shard.outputs.task064_packet_b64 }}
      task064_packet_sha256: ${{ steps.shard.outputs.task064_packet_sha256 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.31"
          enable-cache: true

      - name: Install pinned Python
        run: uv python install

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Run report shard
        id: shard
        run: uv run python tests/ci_shard_runner.py --shard report

  remainder_0:
    name: TASK-064 remainder-0 shard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      task064_packet_b64: ${{ steps.shard.outputs.task064_packet_b64 }}
      task064_packet_sha256: ${{ steps.shard.outputs.task064_packet_sha256 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.31"
          enable-cache: true

      - name: Install pinned Python
        run: uv python install

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Run remainder-0 shard
        id: shard
        run: uv run python tests/ci_shard_runner.py --shard remainder-0

  remainder_1:
    name: TASK-064 remainder-1 shard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      task064_packet_b64: ${{ steps.shard.outputs.task064_packet_b64 }}
      task064_packet_sha256: ${{ steps.shard.outputs.task064_packet_sha256 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.31"
          enable-cache: true

      - name: Install pinned Python
        run: uv python install

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Run remainder-1 shard
        id: shard
        run: uv run python tests/ci_shard_runner.py --shard remainder-1

  remainder_2:
    name: TASK-064 remainder-2 shard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      task064_packet_b64: ${{ steps.shard.outputs.task064_packet_b64 }}
      task064_packet_sha256: ${{ steps.shard.outputs.task064_packet_sha256 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.31"
          enable-cache: true

      - name: Install pinned Python
        run: uv python install

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Run remainder-2 shard
        id: shard
        run: uv run python tests/ci_shard_runner.py --shard remainder-2

  remainder_3:
    name: TASK-064 remainder-3 shard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      task064_packet_b64: ${{ steps.shard.outputs.task064_packet_b64 }}
      task064_packet_sha256: ${{ steps.shard.outputs.task064_packet_sha256 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.31"
          enable-cache: true

      - name: Install pinned Python
        run: uv python install

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Run remainder-3 shard
        id: shard
        run: uv run python tests/ci_shard_runner.py --shard remainder-3

  quality:
    name: Quality and security
    if: always()
    needs:
      - quality_gates
      - report
      - remainder_0
      - remainder_1
      - remainder_2
      - remainder_3
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.31"
          enable-cache: true

      - name: Install pinned Python
        run: uv python install

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Aggregate static TASK-064 shards
        env:
          TASK064_AGG_QUALITY_GATES_RESULT: ${{ needs.quality_gates.result }}
          TASK064_AGG_REPORT_RESULT: ${{ needs.report.result }}
          TASK064_AGG_REMAINDER_0_RESULT: ${{ needs.remainder_0.result }}
          TASK064_AGG_REMAINDER_1_RESULT: ${{ needs.remainder_1.result }}
          TASK064_AGG_REMAINDER_2_RESULT: ${{ needs.remainder_2.result }}
          TASK064_AGG_REMAINDER_3_RESULT: ${{ needs.remainder_3.result }}
          TASK064_AGG_REPORT_PACKET_B64: ${{ needs.report.outputs.task064_packet_b64 }}
          TASK064_AGG_REPORT_PACKET_SHA256: ${{ needs.report.outputs.task064_packet_sha256 }}
          TASK064_AGG_REMAINDER_0_PACKET_B64: ${{ needs.remainder_0.outputs.task064_packet_b64 }}
          TASK064_AGG_REMAINDER_0_PACKET_SHA256: ${{ needs.remainder_0.outputs.task064_packet_sha256 }}
          TASK064_AGG_REMAINDER_1_PACKET_B64: ${{ needs.remainder_1.outputs.task064_packet_b64 }}
          TASK064_AGG_REMAINDER_1_PACKET_SHA256: ${{ needs.remainder_1.outputs.task064_packet_sha256 }}
          TASK064_AGG_REMAINDER_2_PACKET_B64: ${{ needs.remainder_2.outputs.task064_packet_b64 }}
          TASK064_AGG_REMAINDER_2_PACKET_SHA256: ${{ needs.remainder_2.outputs.task064_packet_sha256 }}
          TASK064_AGG_REMAINDER_3_PACKET_B64: ${{ needs.remainder_3.outputs.task064_packet_b64 }}
          TASK064_AGG_REMAINDER_3_PACKET_SHA256: ${{ needs.remainder_3.outputs.task064_packet_sha256 }}
        run: uv run python tests/ci_shard_runner.py --aggregate-static
